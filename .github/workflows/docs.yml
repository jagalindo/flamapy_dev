name: Generate Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click packaging

      - name: Generate documentation
        run: |
          mkdir -p docs
          python flamapy_dev.py docs generate -o docs/cli-reference.md

      - name: Create documentation site
        run: |
          # Create index page
          cat > docs/index.md << 'EOF'
          ---
          layout: default
          title: Flamapy-Dev Documentation
          ---

          # Flamapy-Dev CLI Tool

          A command-line interface for managing multiple flamapy repositories simultaneously.

          ## Quick Start

          ```bash
          # Install
          pip install flamapy-dev

          # Clone all repositories
          flamapy-dev git clone

          # Install in development mode
          flamapy-dev pip install-dev

          # Show package versions
          flamapy-dev version show
          ```

          ## Documentation

          - [CLI Reference](cli-reference.md) - Complete command reference
          - [GitHub Repository](https://github.com/jagalindo/flamapy_dev)

          ## Command Groups

          | Group | Description |
          |-------|-------------|
          | `git` | Repository management (clone, pull, branch, commit, push) |
          | `pip` | Package management (install, update, remove) |
          | `make` | Run make targets (lint, test, mypy) |
          | `version` | Version management (show, check, bump, release) |
          | `docs` | Documentation generation |

          ## Examples

          ### Managing Repositories

          ```bash
          # Clone all repos
          flamapy-dev git clone

          # Check branch status
          flamapy-dev git branch

          # Pull all repos
          flamapy-dev git pull

          # Commit all changes
          flamapy-dev git commit-all "feat: add new feature"
          ```

          ### Version Management

          ```bash
          # Show all versions
          flamapy-dev version show

          # Check version consistency
          flamapy-dev version check

          # Bump all versions (dry run)
          flamapy-dev version bump 2.2.0 --dry-run

          # Full release
          flamapy-dev version release 2.2.0
          ```

          ### Quality Checks

          ```bash
          # Run all checks
          flamapy-dev make all

          # Run with continue on error
          flamapy-dev make all -c
          ```
          EOF

          # Create Jekyll config
          cat > docs/_config.yml << 'EOF'
          title: Flamapy-Dev
          description: CLI tool for managing flamapy repositories
          theme: jekyll-theme-cayman
          markdown: kramdown
          highlighter: rouge
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
